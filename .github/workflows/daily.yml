name: 오늘의 다섯가지 만들고 올리기

# 매일 아침 Claude가 posts/날짜.json 원고를 올리면 자동으로 실행된다.
on:
  push:
    branches: [main]
    paths: ["posts/*.json"]
  workflow_dispatch:
    inputs:
      post:
        description: "다시 돌릴 원고 경로 (예: posts/2026-10-25.json)"
        required: true

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: 이번에 바뀐 원고 찾기
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # 아침 편(날짜.json)과 저녁 편(날짜-2.json)이 한 번에 올라와도 모두 처리
          if [ -n "${{ github.event.inputs.post }}" ]; then
            f="${{ github.event.inputs.post }}"
          else
            base=HEAD~1
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null && base=$BEFORE
            f=$(git diff --name-only --diff-filter=AM "$base" HEAD -- 'posts/*.json' | tr '\n' ' ')
          fi
          echo "posts=$f" >> "$GITHUB_OUTPUT"

      - name: 준비
        if: steps.pick.outputs.posts != ''
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: 실물 사진 받고 슬라이드 만들기
        if: steps.pick.outputs.posts != ''
        run: |
          for f in ${{ steps.pick.outputs.posts }}; do
            python scripts/fetch_images.py "$f"
            python render.py "$f"
            # 세로 릴스 영상과 릴스 캡션 (실패해도 카드뉴스는 그대로 진행)
            python scripts/make_reel.py "$f" || echo "릴스 생성 실패: $f"
          done

      - name: 사진과 슬라이드 저장
        if: steps.pick.outputs.posts != ''
        run: |
          git config user.name "daseot-bot"
          git config user.email "daseot-bot@users.noreply.github.com"
          git add assets out posts
          git commit -m "슬라이드 생성: ${{ steps.pick.outputs.posts }}" || echo "변경 없음"
          git pull --rebase && git push

      - name: 슬라이드를 공개 이미지 저장소에 올리기
        id: images
        if: steps.pick.outputs.posts != ''
        env:
          IMAGES_REPO: ${{ vars.IMAGES_REPO || 'jg0615121-source/daseot-images' }}
          # daseot-images 저장소에만 쓰기 권한이 있는 배포 키
          IMAGES_DEPLOY_KEY: ${{ secrets.IMAGES_DEPLOY_KEY }}
        run: |
          if [ -z "$IMAGES_DEPLOY_KEY" ]; then
            echo "IMAGES_DEPLOY_KEY가 없어서 이미지 업로드와 게시를 건너뜀."
            exit 0
          fi
          key="$RUNNER_TEMP/images_key"
          printf '%s\n' "$IMAGES_DEPLOY_KEY" > "$key" && chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 "git@github.com:${IMAGES_REPO}.git" "$RUNNER_TEMP/images"
          cd "$RUNNER_TEMP/images"
          for f in ${{ steps.pick.outputs.posts }}; do
            d=$(basename "$f" .json)
            mkdir -p "$d" && rm -f "$d"/*.jpg "$d"/reel.mp4
            cp "$GITHUB_WORKSPACE/out/$d/"*.jpg "$d/"
            cp "$GITHUB_WORKSPACE/out/$d/reel.mp4" "$d/" 2>/dev/null || true
            git add "$d"
          done
          git config user.name "daseot-bot"
          git config user.email "daseot-bot@users.noreply.github.com"
          git commit -m "슬라이드: ${{ steps.pick.outputs.posts }}" || echo "변경 없음"
          git push
          # 커밋 주소로 고정해야 같은 날짜를 다시 돌려도 예전 캐시 이미지가 안 나감
          echo "base=https://raw.githubusercontent.com/${IMAGES_REPO}/$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 인스타그램 게시
        if: steps.images.outputs.base != ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
          IMAGE_BASE_URL: ${{ steps.images.outputs.base }}
        run: |
          for f in ${{ steps.pick.outputs.posts }}; do
            python scripts/publish.py "$f"
          done
          git add posts
          git commit -m "게시 기록: ${{ steps.pick.outputs.posts }}" || true
          git push || true
