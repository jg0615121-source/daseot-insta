<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- ZOOM-IN 충주 한 곳 릴스 (v5, 2026-11-20). 프로필 한 줄 [릴스 | 카드뉴스 | 릴스] 의 양옆 칸.
     카드뉴스 '이번 주말 충주' 중 가장 센 한 곳을 9초 안팎으로 깊게 보여준다.
     인기 릴스 분석(docs/benchmark.md 0-2b): 0.3초 훅 스티커, 위 제목 고정, 1~1.5초마다 컷, 말투 자막, 행동 유도 끝.
     구성: 훅 1.3초 → 사진 컷(사진마다 1.3초, 말투 자막 한 줄씩) → 정보 카드 2.1초 → 끝 1.6초.
     scripts/make_reel.py 가 window.build(원고, 품목번호) → window.ready() → window.seek(초) 로 프레임마다 찍는다.
     인스타 화면 아래 300px·오른쪽 160px엔 중요한 글자를 두지 않음. -->
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.woff2);font-weight:700}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.woff2);font-weight:800}
@font-face{font-family:P;src:url(fonts/Pretendard-Black.woff2);font-weight:900}
@font-face{font-family:S;src:url(fonts/instrument-serif-latin-400-italic.woff2);font-style:italic}
:root{--tom:#FF5B2E;--ink:#1E1915;--paper:#F7F0E4;--sand:#E9DECB}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
body{font-family:P,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;letter-spacing:-.03em;position:relative}
.num{font-family:S,serif;font-style:italic;letter-spacing:0}

/* 사진 두 장을 겹쳐 두고 컷이 바뀔 때 0.12초 섞는다 (뚝 끊기지 않게) */
.ph{position:absolute;inset:0;overflow:hidden;background:var(--sand)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.ph.whole{background:var(--paper)}
.ph.whole img{object-fit:contain;top:290px;height:780px}
#shade{position:absolute;inset:0;background:linear-gradient(rgba(30,25,21,.5),rgba(30,25,21,0) 24%,rgba(30,25,21,0) 52%,rgba(30,25,21,.6));pointer-events:none}
#vf{position:absolute;left:70px;right:70px;top:330px;height:1100px;will-change:transform;z-index:3}
#vf i{position:absolute;width:90px;height:90px;border:0 solid var(--paper)}
#vf .a{left:0;top:0;border-left-width:11px;border-top-width:11px}
#vf .b{right:0;top:0;border-right-width:11px;border-top-width:11px}
#vf .c{left:0;bottom:0;border-left-width:11px;border-bottom-width:11px}
#vf .d{right:0;bottom:0;border-right-width:11px;border-bottom-width:11px}
body.wh #vf{top:272px;height:816px}
body.wh #vf i{border-color:var(--ink)}
body.wh #shade{opacity:0}

#top{position:absolute;left:56px;right:56px;top:96px;z-index:5}
#top .tag{display:inline-block;background:var(--tom);font-weight:900;font-size:34px;padding:8px 18px}
#top h1{margin-top:12px;display:inline-block;background:var(--paper);font-weight:900;font-size:70px;line-height:1.12;letter-spacing:-.06em;padding:10px 20px 14px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#top h1 em{font-style:normal;color:var(--tom)}
#bar{position:absolute;left:56px;right:56px;top:66px;height:8px;background:rgba(247,240,228,.45);z-index:5}
body.wh #bar{background:#D9CBB5}
#bar b{position:absolute;left:0;top:0;bottom:0;background:var(--paper)}
body.wh #bar b{background:var(--ink)}

#sub{position:absolute;left:60px;right:180px;top:1130px;z-index:6}
#sub span{display:inline;background:var(--ink);color:var(--paper);font-weight:900;font-size:76px;line-height:1.34;letter-spacing:-.05em;padding:4px 20px 8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#sub span em{font-style:normal;color:var(--tom)}
#pop{position:absolute;right:150px;top:930px;z-index:7;background:var(--tom);font-weight:900;font-size:80px;padding:14px 28px 18px;border:6px solid var(--ink);will-change:transform}

/* 정보 카드: 아래에서 올라옴 */
#card{position:absolute;left:56px;right:56px;top:1000px;z-index:8;background:var(--paper);border:5px solid var(--ink);padding:34px 40px 30px;will-change:transform}
#card .k{font-weight:800;font-size:32px;color:var(--tom)}
#card h2{margin-top:8px;font-weight:900;font-size:66px;line-height:1.1;letter-spacing:-.06em}
#card .rows{margin-top:20px;border-top:3px solid var(--ink)}
#card .rows div{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:2px solid #CDBFAA;font-weight:900;font-size:42px;letter-spacing:-.04em}
#card .rows em{font-style:normal;font-weight:800;font-size:30px;color:#8C7F70}
#card .rows b.hi{color:var(--tom)}

#end{position:absolute;inset:0;background:var(--paper);display:none;z-index:9;padding:320px 64px 0}
#end h2{font-weight:900;font-size:104px;line-height:1.06;letter-spacing:-.065em}
#end h2 em{font-style:normal;color:var(--tom)}
#end .send{margin-top:56px;display:inline-block;background:var(--tom);font-weight:900;font-size:52px;padding:26px 34px;will-change:transform}
#end .more{margin-top:34px;font-weight:800;font-size:38px;color:#4C4239}
#end .h{margin-top:16px;font-weight:800;font-size:34px;color:#8C7F70}
</style>
</head>
<body>
<div class="ph" id="p0"><img></div><div class="ph" id="p1"><img></div><div id="shade"></div>
<div id="vf"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>
<div id="bar"><b></b></div>
<div id="top"><span class="tag" id="tag"></span><br><h1 id="hd"></h1></div>
<div id="pop"></div>
<div id="sub"></div>
<div id="card"></div>
<div id="end"></div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const em = s => esc(s).replace(/\[([^\]]+)\]/g, '<em>$1</em>').replace(/\n/g, '<br>');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const out3 = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const $ = id => document.getElementById(id);
const HOOK = 1.3, CUT = 1.3, CARD = 2.1, END = 1.6, MIX = 0.12;
// 컷마다 움직임: [시작배율, 끝배율, x이동, y이동]
const MOVES = [[1.0, 1.1, 0, 0], [1.25, 1.15, -50, 0], [1.08, 1.2, 40, -30], [1.2, 1.1, 0, 40]];
let P, it, shots = [], total = 0;

window.build = (post, idx) => {
  P = post; it = post.items[idx - 1];
  // 사진: 대표 사진 + 릴스용 추가 사진 (같은 사진만 있으면 다른 움직임으로 여러 컷)
  const imgs = [it.image, ...(it.reel_imgs || [])].filter(Boolean);
  const lines = (it.reel_lines && it.reel_lines.length ? it.reel_lines : [it.name.replace(/\n/g, ' ')]);
  const n = Math.max(3, Math.min(4, Math.max(imgs.length, lines.length - 1)));
  shots = [];
  for (let k = 0; k < n; k++) {
    const src = imgs[k % imgs.length], w = (it.imgsize || {})[src] || [];
    shots.push({ src, whole: it.fit === 'whole' && src === it.image || (w[0] && (w[0] / w[1] > 0.95 || Math.min(...w) < 500)), mv: MOVES[k % 4], line: lines[Math.min(k + 1, lines.length - 1)] });
  }
  $('tag').textContent = String(post.kicker || '').replace(/\s*✦\s*$/, '') + ' · ZOOM-IN 충주';
  $('hd').innerHTML = em(it.reel_title || it.name);
  const f = it.facts || [];
  $('card').innerHTML = `<div class="k">📍 저장해두고 가기</div><h2>${esc(it.name.replace(/\n/g, ' '))}</h2>
    <div class="rows">${f.map(([k, v]) => `<div><em>${esc(k)}</em><b class="${k !== '어디' && /\d|무료/.test(v) ? 'hi' : ''}">${esc(v)}</b></div>`).join('')}</div>`;
  $('end').innerHTML = `<h2>${em(it.reel_end || '이번 주말\n[여기] 어때?')}</h2>
    <div class="send">→ ${esc(((post.outro || {}).lines || [])[1] || '같이 갈 친구 태그하기')}</div>
    <div class="more">이번 주말 충주 다른 곳은 옆 카드뉴스에</div>
    <div class="h">@${esc(post.handle || 'zoomin.chungju')}</div>`;
  window._imgs = imgs.map(s => { const im = new Image(); im.src = s; return im; });
  total = HOOK + CUT * n + CARD + END;
  return total;
};
window.ready = async () => {
  await document.fonts.ready;
  await Promise.all((window._imgs || []).map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
};

// 장면 k(0=훅 사진)의 사진을 layer에 그린다
const paint = (layer, sh, ct, punch) => {
  const el = $(layer), img = el.querySelector('img');
  if (img.getAttribute('src') !== sh.src) { img.setAttribute('src', sh.src); img.style.objectPosition = it.focus || '50% 50%'; }
  el.className = 'ph' + (sh.whole ? ' whole' : '');
  const [z0, z1, dx, dy] = sh.whole ? [1, 1.04, 0, 0] : sh.mv;
  img.style.transform = `translate(${dx * ct}px,${dy * ct}px) scale(${(z0 + (z1 - z0) * ct) * punch})`;
};

window.seek = t => {
  const n = shots.length, tCut0 = HOOK, tCard = HOOK + CUT * n, tEnd = tCard + CARD;
  $('end').style.display = t >= tEnd ? 'block' : 'none';
  if (t >= tEnd) {
    const x = back((t - tEnd - 0.15) / 0.4); $('end').querySelector('.send').style.transform = `scale(${0.85 + 0.15 * x})`;
    return;
  }
  // 지금 컷 번호: 훅은 첫 사진을 그대로 이어 씀
  let k, lt, d;
  if (t < tCut0) { k = 0; lt = t; d = HOOK; }
  else if (t < tCard) { k = Math.floor((t - tCut0) / CUT); lt = t - tCut0 - k * CUT; d = CUT; }
  else { k = n - 1; lt = CUT + (t - tCard); d = CUT + CARD; }
  const sh = shots[k], ct = clamp(lt / d), punch = 1 + 0.07 * (1 - out3(lt / 0.2));
  paint('p1', sh, ct, punch);
  // 컷 바뀔 때 앞 사진과 잠깐 섞기
  const prev = k > 0 && t >= tCut0 && t < tCard ? shots[k - 1] : null;
  if (prev && lt < MIX) { $('p0').style.display = 'block'; paint('p0', prev, 1, 1); $('p1').style.opacity = String(lt / MIX); }
  else { $('p0').style.display = 'none'; $('p1').style.opacity = '1'; }
  document.body.classList.toggle('wh', !!sh.whole);
  $('vf').style.transform = `scale(${1.14 - 0.14 * out3(lt / 0.3)})`;
  $('vf').style.opacity = t < tCard ? '1' : '0';
  $('bar').querySelector('b').style.width = (100 * clamp(t / total)) + '%';
  // 자막·스티커
  const inCard = t >= tCard;
  $('card').style.display = inCard ? 'block' : 'none';
  if (inCard) {
    $('card').style.transform = `translateY(${260 * (1 - out3((t - tCard) / 0.35))}px)`;
    $('sub').innerHTML = ''; $('pop').style.display = 'none';
    return;
  }
  const line = t < tCut0 ? ((it.reel_lines || [])[0] || P.reel_hook_sub || '') : sh.line;
  $('sub').innerHTML = line ? `<span>${em(line)}</span>` : '';
  const pop = t < tCut0 ? (it.reel_hook_pop || it.reel_pop || '') : (k === n - 1 ? (it.reel_pop || '') : '');
  const pt = t < tCut0 ? t : lt;
  $('pop').style.display = pop ? 'block' : 'none';
  $('pop').textContent = pop;
  $('pop').style.transform = `rotate(-8deg) scale(${0.4 + 0.6 * back(pt / 0.3)})`;
};
</script>
</body>
</html>
