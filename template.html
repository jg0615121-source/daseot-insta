<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- ZOOM-IN 충주 카드뉴스 (v2, 2026-11-16): 동네 잡지처럼.
     크림색 종이 + 꽉 찬 사진 + 굵은 먹색 제목 + 가는 선. 흐린 배경·둥근 카드·그림자·그라데이션은 쓰지 않는다 (AI 느낌 나서).
     강조색은 토마토 오렌지 하나, 숫자는 세리프 이탤릭. 사진 모서리의 초점 틀이 로고와 같은 표시. -->
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Medium.woff2);font-weight:500}
@font-face{font-family:P;src:url(fonts/Pretendard-SemiBold.woff2);font-weight:600}
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.woff2);font-weight:700}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.woff2);font-weight:800}
@font-face{font-family:P;src:url(fonts/Pretendard-Black.woff2);font-weight:900}
@font-face{font-family:S;src:url(fonts/instrument-serif-latin-400-italic.woff2);font-style:italic}

:root{ --k:1; --pad:64px; --tom:#FF5B2E; --ink:#1E1915; --paper:#F7F0E4; --sand:#E9DECB; --mute:#8C7F70; --line:#1E1915; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--paper)}
body{font-family:P,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;letter-spacing:-.03em;position:relative}
.num{font-family:S,serif;font-style:italic;letter-spacing:0}

/* 사진 칸: 비율이 맞으면 꽉 채우고, 안 맞으면 모래색 바탕 위에 통째로 (자르지 않음) */
.pic{position:absolute;left:0;right:0;overflow:hidden;background:var(--sand)}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.pic.whole img{object-fit:contain}
/* 초점 틀: 로고와 같은 네 모서리 */
.vf i{position:absolute;width:58px;height:58px;border:0 solid var(--paper)}
.vf .a{left:36px;top:36px;border-left-width:7px;border-top-width:7px}
.vf .b{right:36px;top:36px;border-right-width:7px;border-top-width:7px}
.vf .c{left:36px;bottom:36px;border-left-width:7px;border-bottom-width:7px}
.vf .d{right:36px;bottom:36px;border-right-width:7px;border-bottom-width:7px}
.pic.whole .vf i{border-color:var(--ink)}

/* 위·아래 띠: 잡지 머리글처럼 작은 글자 + 가는 선 */
.mast{position:absolute;left:var(--pad);right:var(--pad);display:flex;justify-content:space-between;align-items:baseline;
  font-weight:800;font-size:22px;letter-spacing:.02em}
.mast b{font-weight:900}
.mast .num{font-size:30px}

/* 표지 */
.cov .pic{top:0;height:800px}
.cov .panel{position:absolute;left:var(--pad);right:var(--pad);top:848px;bottom:56px;display:flex;flex-direction:column}
.kick{font-weight:800;font-size:calc(28px * var(--k));color:var(--tom);letter-spacing:-.01em}
.title{margin-top:18px;font-weight:900;font-size:calc(100px * var(--k));line-height:1.08;letter-spacing:-.065em}
.title em{font-style:normal;color:var(--tom)}
.cov .mast{position:static;margin-top:auto;padding-top:18px;border-top:3px solid var(--line)}

/* 안쪽 장 */
.item .mast{top:44px}
.item .pic{top:100px}
.body{position:absolute;left:var(--pad);right:var(--pad);bottom:52px}
.no{font-size:calc(92px * var(--k));line-height:.8;color:var(--tom)}
.head2{margin-top:14px;font-weight:900;font-size:calc(64px * var(--k));line-height:1.12;letter-spacing:-.06em}
.desc{margin-top:16px;font-weight:600;font-size:calc(31px * var(--k));line-height:1.5;color:#4C4239}
.facts{margin-top:22px;border-top:3px solid var(--line)}
.facts div{display:flex;justify-content:space-between;align-items:baseline;padding:13px 0;border-bottom:1.5px solid #CDBFAA}
.facts em{font-style:normal;font-weight:700;font-size:calc(24px * var(--k));color:var(--mute)}
.facts b{font-weight:800;font-size:calc(32px * var(--k));letter-spacing:-.04em;max-width:78%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facts b.hi{color:var(--tom)}
.credit{margin-top:12px;font-weight:500;font-size:18px;color:var(--mute);text-align:right}

/* 마무리 장: 한 장에 다시 보기(저장할 이유) + 질문 + 공유 */
.outro{position:absolute;inset:0;padding:44px var(--pad) 52px;display:flex;flex-direction:column}
.outro .mast{position:static}
.recap{margin-top:40px;border-top:3px solid var(--line)}
.recap div{display:flex;align-items:center;gap:26px;padding:20px 0;border-bottom:1.5px solid #CDBFAA}
.recap .num{flex:none;width:52px;font-size:52px;line-height:1;color:var(--tom)}
.recap p{flex:1;min-width:0;font-weight:800;font-size:33px;letter-spacing:-.045em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recap p small{display:block;margin-top:5px;font-weight:600;font-size:23px;color:var(--mute)}
.recap figure{flex:none;width:96px;height:96px;overflow:hidden;background:var(--sand)}
.recap figure img{width:100%;height:100%;object-fit:cover;display:block}
.ask{margin-top:48px;font-weight:900;font-size:66px;line-height:1.12;letter-spacing:-.065em}
.todo{margin-top:26px}
.todo div{font-weight:700;font-size:30px;color:#4C4239;padding:12px 0}
/* 공유(DM 보내기)가 비팔로워 도달에 가장 큰 신호라 두 번째 줄을 가장 크게 */
.todo div.send{margin:8px 0;padding:24px 28px;background:var(--tom);color:var(--ink);font-weight:900;font-size:34px}
.src{margin-top:auto;font-weight:500;font-size:18px;line-height:1.6;color:var(--mute)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const br = s => esc(s).replace(/\n/g,"<br>");
// 제목 속 [ ]로 감싼 말은 강조색 글자로
const title = s => br(s).replace(/\[([^\]]+)\]/g,"<em>$1</em>");
// focus: 사진에서 보여줄 위치, zoom: 확대 배율 (불필요한 부분을 잘라낼 때)
const img = (src,focus,zoom) => `<img src="${esc(src)}" style="object-position:${esc(focus||"50% 50%")};transform:scale(${+zoom||1});transform-origin:${esc(focus||"50% 50%")}" alt="">`;
const vf = `<div class="vf"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>`;
// 칸 비율과 사진 비율이 비슷하거나 fit:"cover"면 꽉 채움, 아니면 통째로
const wholeOr = (it, W, H) => {
  if (it.fit === "cover") return "";
  if (it.fit === "whole") return " whole";
  if (!(it.w && it.h)) return "";
  const r = (it.w/it.h) / (W/H);
  return (r > 0.72 && r < 1.38 && Math.min(it.w,it.h) >= 700) ? "" : " whole";
};
const two = n => String(n).padStart(2,"0");
const md = d => d ? d.slice(5).replace("-",".") : "";

function cover(p){
  // 사진은 cover_item 품목 1장 (fetch_images.py가 cover_images로 채움)
  const c = (p.cover_images && p.cover_images[0]) || p.items[0];
  const n = p.items.length;
  return `<section class="cov">
    <div class="pic${wholeOr(c,1080,800)}" data-pic>${img(c.image,c.focus,c.zoom)}${vf}</div>
    <div class="panel foot">
      <div class="kick">${esc(String(p.kicker||"").replace(/\s*✦\s*$/,""))}</div>
      <h1 class="title">${title(p.title)}</h1>
      <div class="mast"><span><b>ZOOM-IN</b> 충주 · ${esc(md(p.date))}</span><span><span class="num">${two(n)}</span> 넘겨보기 →</span></div>
    </div></section>`;
}
// 숫자가 든 값(가격, 날짜)은 강조색
const factRow = ([k,v]) => `<div><em>${esc(k)}</em><b${/\d|무료/.test(v)?' class="hi"':""}>${esc(v)}</b></div>`;
function item(p,i){
  const it = p.items[i], n = p.items.length;
  return `<section class="item">
    <div class="mast"><span><b>ZOOM-IN</b> 충주</span><span><span class="num">${two(i+1)}</span> / ${two(n)}</span></div>
    <div class="pic${wholeOr(it,1080,700)}" data-pic>${img(it.image,it.focus,it.zoom)}${vf}</div>
    <div class="body foot">
      <div class="no num">${two(i+1)}</div>
      <h2 class="head2">${br(it.name)}</h2>
      <p class="desc">${br(it.desc)}</p>
      ${(it.facts||[]).length?`<div class="facts">${it.facts.map(factRow).join("")}</div>`:""}
      ${it.credit?`<div class="credit">${esc(it.credit)}</div>`:""}
    </div></section>`;
}
function outro(p){
  // 품목을 한 줄씩 다시 보여줌: 이 장만 저장해도 쓸모 있게
  const rows = p.items.map((it,j)=>{
    const f = (it.facts||[]).find(([k,v])=>/\d/.test(v)) || (it.facts||[])[0];
    return `<div><span class="num">${two(j+1)}</span><p>${esc(it.name.replace(/\n/g," "))}${f?`<small>${esc(f[0])} ${esc(f[1])}</small>`:""}</p><figure>${img(it.image,it.focus,it.zoom)}</figure></div>`;
  }).join("");
  const o = p.outro || {question:"", lines:[]};
  return `<section class="outro">
    <div class="mast"><span><b>ZOOM-IN</b> 충주</span><span>@${esc(p.handle)}</span></div>
    <div class="recap">${rows}</div>
    <h2 class="ask">${br(o.question)}</h2>
    <div class="todo">${(o.lines||[]).map((l,j)=>`<div${j===1?' class="send"':""}>${j===1?"→ ":""}${br(l)}</div>`).join("")}</div>
    <p class="src">출처  ${(p.sources||[]).map(esc).join(" / ")}</p>
  </section>`;
}
function setK(k){ document.documentElement.style.setProperty("--k", k); }
function render(p, slide){
  const n = p.items.length, root = document.getElementById("root");
  setK(1);
  root.innerHTML = slide===0 ? cover(p) : slide<=n ? item(p,slide-1) : outro(p);
  if (slide>n){
    const o = root.querySelector(".outro");
    return {k:1, fits: o.scrollHeight <= 1350};
  }
  const foot = root.querySelector(".foot");
  let k = 1;
  if (slide===0){
    // 제목이 칸을 넘치면 글자를 줄임
    const over = () => foot.scrollHeight > foot.clientHeight + 1;
    while (over() && k > 0.74){ k -= 0.02; setK(k); }
    return {k:+k.toFixed(2), fits:!over()};
  }
  // 안쪽 장: 글 덩어리 위에 남는 공간이 사진 칸. 사진 칸이 너무 작아지면 글자를 줄임
  const pic = root.querySelector("[data-pic]");
  const room = () => foot.getBoundingClientRect().top - 36 - 100;
  while (room() < 560 && k > 0.74){ k -= 0.02; setK(k); }
  const H = Math.min(room(), 760);
  pic.style.height = H + "px";
  const it = p.items[slide-1];
  pic.className = "pic" + wholeOr(it,1080,H);
  return {k:+k.toFixed(2), fits: room() >= 460};
}
window.render = render;
</script>
</body>
</html>
