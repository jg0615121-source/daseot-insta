<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 릴스 템플릿 v2 (1080x1920, 2026-10-31). make_reel.py가 window.build(원고)로 장면을 다 깔고
     window.seek(초)로 CSS 애니메이션을 그 시점에 멈춘 뒤 프레임마다 찍어 영상으로 잇는다.
     v1(장면마다 정지 PNG 2장 + 페이드)과 다른 점: 0프레임부터 제목이 보임(넘김 방지·격자 썸네일),
     품목 내내 위에 시리즈 제목 고정, 넘기는 듯한 장면 전환과 번호·숫자 튀어나옴, 마지막은 5개 요약표.
     인스타 릴스 화면은 아래 약 330px(캡션·버튼)과 오른쪽 약 140px(아이콘), 위 약 180px가 가려지므로 글씨는 그 밖에 둔다. -->
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.woff2);font-weight:700}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.woff2);font-weight:800}
@font-face{font-family:P;src:url(fonts/Pretendard-Black.woff2);font-weight:900}
:root{--b1:#2F54FF;--b2:#00C2A8;--accent:linear-gradient(135deg,var(--b1),var(--b2))}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:P,sans-serif;color:#fff;word-break:keep-all;letter-spacing:-.03em;-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;overflow:hidden;animation-fill-mode:both}
.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bg{position:absolute;inset:-80px;width:calc(100% + 160px);height:calc(100% + 160px);object-fit:cover;filter:blur(50px) brightness(.42) saturate(1.25);animation:drift var(--d,3s) linear both}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 40%,rgba(0,0,0,.85) 72%,#000 100%)}
.pill{display:inline-block;background:#fff;color:#1a1a1a;font-weight:800;font-size:34px;padding:12px 26px;border-radius:999px}
mark{background:var(--accent);color:#fff;padding:0 .1em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* 훅: 0프레임부터 제목이 다 보인다. 사진만 천천히 확대 */
.hook .cover{animation:zoom var(--d) linear both}
.hook .txt{position:absolute;left:56px;right:150px;bottom:440px}
.hook h1{margin-top:34px;font-weight:900;font-size:128px;line-height:1.1;text-shadow:0 6px 30px rgba(0,0,0,.5)}
.hook p{margin-top:36px;font-weight:800;font-size:44px}
.hook p i{display:inline-block;font-style:normal;animation:nudge .6s ease-in-out infinite alternate}

/* 위 고정 머리: 품목 내내 시리즈 제목이 보인다 */
.head{position:absolute;left:0;right:0;top:0;height:420px;padding:196px 56px 0;background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.6) 70%,rgba(0,0,0,0))}
.head .row{display:flex;align-items:center;justify-content:space-between}
.head .pill{font-size:30px;padding:10px 22px}
.head .count{font-weight:900;font-size:44px}
.head .count small{opacity:.55;font-size:32px}
.head h2{margin-top:22px;font-weight:900;font-size:58px;line-height:1.15;white-space:nowrap}
.head .bar{position:absolute;left:56px;right:56px;top:398px;height:8px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
.head .bar i{position:absolute;inset:0;background:var(--accent);transform-origin:left;animation:fill var(--d) linear both}

/* 품목: 사진 카드 + 번호 배지 + 큰 제목 + 핵심 숫자 */
.card{position:absolute;left:40px;right:40px;top:450px;height:var(--ph);display:flex;justify-content:center}
.card img{max-width:100%;height:100%;object-fit:contain;border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:zoomIn var(--d) linear both}
.num{position:absolute;left:24px;top:-34px;width:136px;height:136px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:80px;box-shadow:0 12px 34px rgba(0,0,0,.45);animation:pop .4s cubic-bezier(.3,1.6,.5,1) .12s both}
.name{position:absolute;left:56px;right:150px;top:calc(450px + var(--ph) + 44px);font-weight:900;font-size:84px;line-height:1.14;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.fact{position:absolute;left:56px;top:calc(450px + var(--ph) + 268px);display:flex;gap:16px;align-items:center;animation:rise .35s ease-out .35s both}
.fact span{background:#fff;color:var(--b1);font-weight:900;font-size:46px;padding:10px 24px;border-radius:16px}
.fact em{font-style:normal;font-weight:800;font-size:36px;opacity:.85}

/* 마무리: 5개 요약표 + 공유 버튼 (캡처해 두면 그대로 쓸모 있게) */
.outro .list{position:absolute;left:56px;right:150px;top:452px}
.outro .it{display:flex;align-items:center;gap:26px;height:162px;animation:rise .3s ease-out both}
.outro .it img{width:132px;height:132px;border-radius:22px;object-fit:cover;flex:none}
.outro .it b{flex:none;width:58px;font-weight:900;font-size:52px;color:var(--b2)}
.outro .it div{min-width:0}
.outro .it strong{display:block;font-weight:900;font-size:42px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outro .it small{display:block;margin-top:6px;font-weight:800;font-size:32px;opacity:.75}
.outro .cta{position:absolute;left:56px;right:150px;top:1290px;animation:rise .35s ease-out .55s both}
.outro .send{background:var(--accent);font-weight:900;font-size:46px;padding:26px 32px;border-radius:24px;animation:pulse .7s ease-in-out 1s infinite alternate}
.outro .cta p{margin-top:26px;font-weight:800;font-size:36px;opacity:.9}

@keyframes zoom{from{transform:scale(1.02)}to{transform:scale(1.12)}}
@keyframes zoomIn{from{transform:scale(1) translateY(6px)}to{transform:scale(1.09) translateY(-10px)}}
@keyframes drift{from{transform:scale(1.05) translateX(-20px)}to{transform:scale(1.12) translateX(20px)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes nudge{from{transform:translateX(0)}to{transform:translateX(14px)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.04)}}
@keyframes inR{from{transform:translateX(100%)}to{transform:none}}
@keyframes outL{from{transform:none}to{transform:translateX(-100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style></head>
<body><div id="root"></div>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const br = s => esc(s).replace(/\n/g, '<br>');
const mark = s => br(s).replace(/\[(.+?)\]/g, '<mark>$1</mark>');
const oneLine = s => esc(s).replace(/\s*\n\s*/g, ' ').replace(/\[(.+?)\]/g, '<mark>$1</mark>');
// 숫자가 든 사실(가격·날짜·할인)을 우선 보여준다
const keyFact = it => (it.facts || []).find(f => /\d/.test(f[1])) || (it.facts || [])[0];
const T = {hook: 1.9, item: 2.6, outro: 3.2, slide: 0.28};

// 장면을 다 깔고 전체 길이(초)를 돌려준다. 각 장면은 시작 시각에 오른쪽에서 밀려 들어오고 다음 장면이 올 때 왼쪽으로 밀려 나간다.
window.build = post => {
  const items = post.items, n = items.length, root = document.getElementById('root');
  const cover = (post.cover_images && post.cover_images[0]) || items[(post.cover_item || 1) - 1];
  // 릴스 훅: 원고의 reel_hook(궁금증형 릴스 전용 문구)이 있으면 그것, 없으면 카드뉴스 표지 제목
  const hook = post.reel_hook || post.title;
  const starts = [0], parts = [];
  // 사진 카드 높이: 가로 1000에 맞췄을 때 높이, 최대 760 (제목·숫자가 아래 가림 영역 위에 오게)
  const ph = it => Math.round(it.w && it.h ? Math.min(760, 1000 * it.h / it.w) : 760);
  const anim = (k, last) => {
    const a = [`inR ${T.slide}s ease-out ${starts[k]}s both`];
    // 나가기는 forwards만: both로 두면 들어오기 전에도 '제자리'로 덮어써 화면에 미리 보인다
    if (!last) a.push(`outL ${T.slide}s ease-in ${starts[k + 1]}s forwards`);
    return k === 0 ? (last ? 'none' : a[1]) : a.join(',');
  };
  const durs = [T.hook, ...items.map(() => T.item), T.outro];
  durs.forEach((d, k) => starts.push(starts[k] + d));
  const total = starts[durs.length];
  // 장면 안쪽 애니메이션은 장면 시작 시각만큼 늦춘다
  const local = (k, html) => `<div class="scene" style="animation:${anim(k, k === durs.length - 1)}"><div style="position:absolute;inset:0" data-at="${starts[k]}">${html}</div></div>`;

  parts.push(local(0, `<div class="hook" style="--d:${T.hook + T.slide}s;position:absolute;inset:0">
      <img class="cover" src="${esc(cover.image)}" style="object-position:${esc(cover.focus || '50% 50%')}"><div class="shade"></div>
      <div class="txt"><span class="pill">${esc(post.kicker)}</span><h1>${mark(hook)}</h1><p>끝까지 보면 5개 다 나옴 <i>→</i></p></div></div>`));
  items.forEach((it, i) => {
    const f = keyFact(it);
    parts.push(local(i + 1, `<div style="--ph:${ph(it)}px;--d:${T.item + T.slide}s;position:absolute;inset:0">
      <img class="bg" src="${esc(it.image)}">
      <div class="card"><img src="${esc(it.image)}"><div class="num">${i + 1}</div></div>
      <div class="name">${br(it.name)}</div>
      ${f ? `<div class="fact"><span>${esc(f[1])}</span><em>${esc(f[0])}</em></div>` : ''}</div>`));
  });
  parts.push(local(n + 1, `<div class="outro" style="position:absolute;inset:0">
      <img class="bg" src="${esc(items[0].image)}">
      <div class="list">${items.map((it, i) => { const f = keyFact(it);
        return `<div class="it" style="animation-delay:${0.25 + i * 0.07}s"><img src="${esc(it.image)}"><b>${i + 1}</b>
          <div><strong>${esc(it.name.replace(/\s*\n\s*/g, ' '))}</strong>${f ? `<small>${esc(f[0])} ${esc(f[1])}</small>` : ''}</div></div>`; }).join('')}</div>
      <div class="cta"><div class="send">→ ${esc((post.outro && post.outro.lines || [])[1] || '친구한테 보내기')}</div>
        <p>저장해두고 꺼내보기 📌 매일 아침·저녁 5개씩</p></div></div>`));

  // 위 고정 머리: 첫 품목이 들어올 때 나타나서 마무리까지 그대로
  const itemsLen = total - starts[1];
  parts.push(`<div class="head" style="opacity:0;animation:fadeIn .25s ease-out ${starts[1]}s both">
      <div class="row"><span class="pill">${esc(post.kicker.replace(/\s*✦\s*$/, ''))}</span>
      <span class="count" id="count"></span></div>
      <h2 id="h2">${oneLine(hook)}</h2>
      <div class="bar" style="--d:${itemsLen}s"><i style="animation-delay:${starts[1]}s"></i></div></div>`);
  root.innerHTML = parts.join('');
  // 장면 안쪽 애니메이션 지연에 장면 시작 시각을 더한다
  root.querySelectorAll('[data-at]').forEach(el => {
    const at = +el.dataset.at;
    el.querySelectorAll('*').forEach(c => {
      const cs = getComputedStyle(c);
      if (cs.animationName === 'none') return;
      c.style.animationDelay = cs.animationDelay.split(',').map(d => (parseFloat(d) + at) + 's').join(',');
    });
  });
  // 머리 제목이 한 줄에 안 들어가면 글자를 줄인다
  const h2 = document.getElementById('h2');
  for (let s = 58; h2.scrollWidth > 968 && s > 36; s -= 2) h2.style.fontSize = s + 'px';
  window._starts = starts; window._n = n;
  return total;
};

// 모든 애니메이션을 t초 시점으로 멈춘다
window.seek = t => {
  document.getAnimations().forEach(a => { a.pause(); a.currentTime = t * 1000; });
  const s = window._starts, k = s.findIndex((v, i) => t < s[i + 1]);  // 지금 장면 번호
  const i = Math.min(Math.max(k, 1), window._n);
  document.getElementById('count').innerHTML = k > window._n ? `5<small>/5</small>` : `${i}<small>/${window._n}</small>`;
};

// 사진과 글꼴이 다 준비됐는지
window.ready = async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.decode().catch(() => {})));
  return true;
};
</script></body></html>
