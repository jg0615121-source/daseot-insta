<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- ZOOM-IN 충주 릴스 (v3, 2026-11-16). 카드뉴스와 같은 잡지 디자인 (크림 종이, 먹색 제목, 토마토 강조, 세리프 숫자).
     scripts/make_reel.py 가 window.build(원고) → window.ready() → window.seek(초) 로 프레임마다 찍는다.
     원칙 (docs/benchmark.md): 0프레임부터 제목이 보임(넘김 방지), 장면마다 '초점 맞추기' 줌인(로고의 초점 틀),
     사진은 계속 천천히 움직임, 글자는 흐려지지 않게 고정, 인스타 화면 아래쪽 300px·오른쪽 160px엔 중요한 글자를 두지 않음. -->
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-SemiBold.woff2);font-weight:600}
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.woff2);font-weight:700}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.woff2);font-weight:800}
@font-face{font-family:P;src:url(fonts/Pretendard-Black.woff2);font-weight:900}
@font-face{font-family:S;src:url(fonts/instrument-serif-latin-400-italic.woff2);font-style:italic}
:root{--tom:#FF5B2E;--ink:#1E1915;--paper:#F7F0E4;--sand:#E9DECB;--mute:#8C7F70}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
body{font-family:P,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;letter-spacing:-.03em;position:relative}
.num{font-family:S,serif;font-style:italic;letter-spacing:0}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}

/* 위 띠 + 진행 막대: 모든 장면에 고정 */
.mast{position:absolute;left:64px;right:64px;top:70px;display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:30px;z-index:5}
.mast b{font-weight:900}
.bar{position:absolute;left:64px;right:64px;top:126px;height:6px;display:flex;gap:8px;z-index:5}
.bar i{flex:1;background:#D9CBB5;position:relative;overflow:hidden}
.bar i b{position:absolute;left:0;top:0;bottom:0;background:var(--ink);width:0}

/* 사진 칸 + 초점 틀 */
.pic{position:absolute;left:0;right:0;overflow:hidden;background:var(--sand)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.pic.whole img{object-fit:contain}
.vf{position:absolute;inset:0;will-change:transform}
.vf i{position:absolute;width:84px;height:84px;border:0 solid var(--paper)}
.pic.whole .vf i{border-color:var(--ink)}
.vf .a{left:44px;top:44px;border-left-width:10px;border-top-width:10px}
.vf .b{right:44px;top:44px;border-right-width:10px;border-top-width:10px}
.vf .c{left:44px;bottom:44px;border-left-width:10px;border-bottom-width:10px}
.vf .d{right:44px;bottom:44px;border-right-width:10px;border-bottom-width:10px}

/* 훅(첫 장면) */
.hook .pic{top:170px;height:1000px}
.hook .txt{position:absolute;left:64px;right:120px;top:1215px}
.kick{font-weight:800;font-size:38px;color:var(--tom)}
.hook h1{margin-top:16px;font-weight:900;font-size:124px;line-height:1.06;letter-spacing:-.065em}
.hook h1 em{font-style:normal;color:var(--tom)}
.hook .sub{margin-top:26px;font-weight:800;font-size:36px;color:var(--mute)}

/* 품목 장면 */
.item .pic{top:170px;height:1010px}
.item .txt{position:absolute;left:64px;right:150px;top:1205px}
.item .no{font-size:118px;line-height:.8;color:var(--tom);will-change:transform}
.item h2{margin-top:14px;font-weight:900;font-size:84px;line-height:1.1;letter-spacing:-.06em}
.chips{margin-top:26px;display:flex;flex-wrap:wrap;gap:12px}
.chips span{display:inline-flex;align-items:baseline;gap:12px;padding:12px 20px;border:3px solid var(--ink);font-weight:800;font-size:34px;background:var(--paper);will-change:transform}
.chips span em{font-style:normal;font-weight:700;font-size:26px;color:var(--mute)}
.chips span.hi{background:var(--tom);border-color:var(--tom)}
.chips span.hi em{color:var(--ink)}

/* 마무리 */
.outro .wrap{position:absolute;left:64px;right:150px;top:200px}
.outro h3{font-weight:800;font-size:36px;color:var(--tom)}
.recap{margin-top:20px;border-top:4px solid var(--ink)}
.recap div{display:flex;align-items:center;gap:26px;padding:24px 0;border-bottom:2px solid #CDBFAA;will-change:transform}
.recap .num{flex:none;width:70px;font-size:70px;line-height:1;color:var(--tom)}
.recap p{flex:1;min-width:0;font-weight:900;font-size:44px;letter-spacing:-.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recap p small{display:block;margin-top:6px;font-weight:700;font-size:30px;color:var(--mute)}
.recap figure{flex:none;width:120px;height:120px;overflow:hidden;background:var(--sand)}
.recap figure img{width:100%;height:100%;object-fit:cover;display:block}
.outro h2{margin-top:56px;font-weight:900;font-size:92px;line-height:1.08;letter-spacing:-.065em}
.send{margin-top:36px;padding:30px 34px;background:var(--tom);font-weight:900;font-size:44px;will-change:transform}
.save{margin-top:24px;font-weight:800;font-size:36px;color:#4C4239}
.handle{margin-top:20px;font-weight:800;font-size:32px;color:var(--mute)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const br = s => esc(s).replace(/\n/g, '<br>');
const two = n => String(n).padStart(2, '0');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const out3 = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const VF = '<div class="vf"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>';
// 사진 칸 비율과 맞으면 꽉 채우고, 아니면 통째로 (카드뉴스 template.html과 같은 기준)
const whole = (it, W, H) => {
  if (it.fit === 'cover') return '';
  if (it.fit === 'whole') return ' whole';
  if (!(it.w && it.h)) return '';
  const r = (it.w / it.h) / (W / H);
  return (r > 0.72 && r < 1.38 && Math.min(it.w, it.h) >= 700) ? '' : ' whole';
};
const pic = (it, H) => `<div class="pic${whole(it, 1080, H)}"><img src="${esc(it.image)}" style="object-position:${esc(it.focus || '50% 50%')}">${VF}</div>`;
// 핵심 정보 칩: '어디' + 숫자 든 값 하나(날짜·가격) 강조
const chips = it => {
  const f = it.facts || [];
  const where = f.find(([k]) => k === '어디');
  const key = f.find(([k, v]) => k !== '어디' && /\d|무료/.test(v));
  return [where, key].filter(Boolean).map(([k, v]) => `<span class="${v === (key || [])[1] ? 'hi' : ''}"><em>${esc(k)}</em>${esc(v)}</span>`).join('');
};

const D = { hook: 2.3, item: 3.0, outro: 3.6 };
let S = [], post = null;

window.build = p => {
  post = p;
  const n = p.items.length;
  const c = (p.cover_images && p.cover_images[0]) || p.items[(p.cover_item || 1) - 1];
  const kicker = esc(String(p.kicker || '').replace(/\s*✦\s*$/, ''));
  const bar = `<div class="bar">${p.items.map(() => '<i><b></b></i>').join('')}</div>`;
  let t = 0, html = '';
  S = [];
  const add = (kind, i, inner) => { S.push({ kind, i, t0: t, d: D[kind] }); t += D[kind]; html += `<section class="scene ${kind}" data-k="${S.length - 1}">${inner}</section>`; };
  add('hook', -1, `<div class="mast"><span><b>ZOOM-IN</b> 충주</span><span>${kicker}</span></div>
    ${pic(c, 1000)}
    <div class="txt"><div class="kick">${kicker}</div><h1>${br(p.reel_hook || p.title).replace(/\[([^\]]+)\]/g, '<em>$1</em>')}</h1>
    <div class="sub">끝까지 보면 ${n}곳 다 나옴 →</div></div>`);
  p.items.forEach((it, i) => add('item', i, `<div class="mast"><span><b>ZOOM-IN</b> 충주</span><span><span class="num">${two(i + 1)}</span> / ${two(n)}</span></div>${bar}
    ${pic(it, 1010)}
    <div class="txt"><div class="no num">${two(i + 1)}</div><h2>${br(it.name)}</h2><div class="chips">${chips(it)}</div></div>`));
  const rows = p.items.map((it, j) => {
    const f = (it.facts || []).find(([k, v]) => k !== '어디' && /\d/.test(v)) || (it.facts || [])[0];
    return `<div><span class="num">${two(j + 1)}</span><p>${esc(it.name.replace(/\n/g, ' '))}${f ? `<small>${esc(f[0])} ${esc(f[1])}</small>` : ''}</p><figure><img src="${esc(it.image)}" style="object-position:${esc(it.focus || '50% 50%')}"></figure></div>`;
  }).join('');
  const o = p.outro || {};
  add('outro', -1, `<div class="mast"><span><b>ZOOM-IN</b> 충주</span><span>@${esc(p.handle || 'zoomin.chungju')}</span></div>
    <div class="wrap"><h3>${kicker} 정리</h3><div class="recap">${rows}</div>
    <h2>${br(o.question || '이 중에\n하나만 간다면?')}</h2>
    <div class="send">→ ${esc((o.lines || [])[1] || '같이 갈 친구한테 보내기')}</div>
    <div class="save">저장해두고 나가기 전에 꺼내보기 📌</div>
    <div class="handle">충주에서 뭐 하지? @${esc(p.handle || 'zoomin.chungju')}</div></div>`);
  document.getElementById('root').innerHTML = html;
  return t;
};

window.ready = async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
};

// 초점 맞추기: 장면 시작 0.45초 동안 사진이 살짝 크게 시작해 제자리로, 초점 틀은 바깥에서 안으로 조여 듦
const focusIn = (sc, lt, d, kb) => {
  const img = sc.querySelector('.pic img'), vf = sc.querySelector('.vf');
  const snap = out3(lt / 0.45);
  // 포스터처럼 통째로 넣은 사진은 잘리면 안 되니 아주 조금만 움직임
  if (sc.querySelector('.pic.whole')) kb = [0.94, 0.99, 0];
  // 켄 번스: 장면 내내 천천히 확대 (kb: 시작→끝 배율), 짝수·홀수 장면마다 이동 방향을 바꿈
  const z = ((sc.querySelector('.pic.whole') ? 1.04 : 1.12) - (sc.querySelector('.pic.whole') ? 0.04 : 0.12) * snap) * (kb[0] + (kb[1] - kb[0]) * clamp(lt / d));
  const dx = kb[2] * clamp(lt / d);
  if (img) img.style.transform = `translateX(${dx}px) scale(${z})`;
  if (vf) vf.style.transform = `scale(${1.18 - 0.18 * snap})`;
  if (vf) vf.style.opacity = String(clamp(lt / 0.15));
};

window.seek = t => {
  let k = S.findIndex(s => t < s.t0 + s.d); if (k < 0) k = S.length - 1;
  const s = S[k], lt = t - s.t0;
  document.querySelectorAll('.scene').forEach(e => e.classList.toggle('on', +e.dataset.k === k));
  const sc = document.querySelector(`.scene[data-k="${k}"]`);
  if (s.kind === 'hook') {
    focusIn(sc, lt, s.d, [1, 1.08, 0]);
  } else if (s.kind === 'item') {
    focusIn(sc, lt, s.d, [1, 1.1, s.i % 2 ? 30 : -30]);
    // 진행 막대: 지난 품목은 꽉, 지금 품목은 시간만큼 차오름
    sc.querySelectorAll('.bar i b').forEach((b, j) => b.style.width = (j < s.i ? 100 : j > s.i ? 0 : 100 * clamp(lt / s.d)) + '%');
    // 번호는 옆에서 밀려 들어오고, 제목·칩은 0프레임부터 보임 (칩만 살짝 튀어나옴)
    const no = sc.querySelector('.no'); no.style.transform = `translateX(${-60 * (1 - out3(lt / 0.35))}px)`;
    sc.querySelectorAll('.chips span').forEach((c, j) => { const x = back((lt - 0.25 - 0.12 * j) / 0.4); c.style.transform = `scale(${0.85 + 0.15 * x})`; });
  } else {
    sc.querySelectorAll('.recap div').forEach((r, j) => { const x = out3((lt - 0.08 * j) / 0.4); r.style.transform = `translateX(${-40 * (1 - x)}px)`; });
    const send = sc.querySelector('.send'); const x = back((lt - 0.5) / 0.45); send.style.transform = `scale(${0.9 + 0.1 * x})`;
  }
};
</script>
</body>
</html>
